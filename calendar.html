<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Capstone Calendar</title>
    <style>html,body{height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}</style>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <script src="./fullcalendar-7.1.1/dist/fullcalendar.global.js"></script>
    <script src="./fullcalendar-7.1.1/dist/themes/monarch/global.js"></script>
    <link href="./fullcalendar-7.1.1/dist/skeleton.css" rel="stylesheet" />
    <link href="./fullcalendar-7.1.1/dist/themes/monarch/theme.css" rel="stylesheet" />
    <link href="./fullcalendar-7.1.1/dist/themes/monarch/palettes/purple.css" rel="stylesheet" />
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const calendarEl = document.getElementById('calendar');
        const calendar = new FullCalendar.Calendar(calendarEl, {
          height: '100%',
          initialView: 'dayGridMonth',
          headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
          },
          eventMouseEnter: function(info) {
            window.parent.postMessage({
              type: 'eventHover',
              title: info.event.title || '(Untitled event)',
              description: info.event.extendedProps.description || 'No description.'
            }, '*');
          },
          events: './Events.json'
        });
        calendar.render();
      });
    </script>
  </head>
  <body style="margin:0;height:100vh">
    <div id="calendar" style="height:100%"></div>
  </body>
</html>
